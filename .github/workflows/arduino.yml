---
name: Arduino

on:
  push:
    paths:
      - "firmware/arduino/**"
      - ".github/workflows/arduino.yml"
  pull_request:
    paths:
      - "firmware/arduino/**"
      - ".github/workflows/arduino.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: Sensirion Core
            - name: Sensirion I2C SGP40
            - name: Sensirion I2C SGP41
            - name: Sensirion I2C SFA4x
            - name: Sensirion I2C STCC4
            - source-url: https://github.com/DFRobot/DFRobot_BMV080.git
          sketch-paths: |
            - firmware/arduino/sensor-test
